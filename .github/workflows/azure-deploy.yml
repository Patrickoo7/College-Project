name: Azure Deployment CI/CD

on:
  push:
    branches:
      - main
      - master
      - claude/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: heart-disease-rg
  AZURE_LOCATION: eastus
  ACR_NAME: heartdiseaseacr
  API_APP_NAME: heart-disease-api
  WEB_APP_NAME: heart-disease-web
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run flake8
      run: flake8 src/ --max-line-length=120 --extend-ignore=E203,W503
      continue-on-error: true

    - name: Check code formatting with black
      run: black --check src/
      continue-on-error: true

    - name: Check import ordering with isort
      run: isort --check-only src/
      continue-on-error: true

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get ACR credentials
      id: acr-creds
      run: |
        ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query "username" -o tsv)
        ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
        ACR_LOGIN_SERVER="${{ env.ACR_NAME }}.azurecr.io"
        echo "::add-mask::$ACR_PASSWORD"
        echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
        echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
        echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.acr-creds.outputs.acr_login_server }}
        username: ${{ steps.acr-creds.outputs.acr_username }}
        password: ${{ steps.acr-creds.outputs.acr_password }}

    - name: Build and push API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.api
        push: true
        tags: |
          ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-api:latest
          ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-api:${{ github.sha }}

    - name: Build and push Web Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.web
        push: true
        tags: |
          ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-web:latest
          ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-web:${{ github.sha }}

    - name: Deploy API to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.API_APP_NAME }}
        images: ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-api:${{ github.sha }}

    - name: Deploy Web to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEB_APP_NAME }}
        images: ${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-web:${{ github.sha }}

    - name: Restart API App Service
      run: |
        az webapp restart --name ${{ env.API_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Restart Web App Service
      run: |
        az webapp restart --name ${{ env.WEB_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Get application URLs
      id: app-urls
      run: |
        API_URL=$(az webapp show --name ${{ env.API_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "defaultHostName" -o tsv)
        WEB_URL=$(az webapp show --name ${{ env.WEB_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "defaultHostName" -o tsv)
        echo "api_url=https://$API_URL" >> $GITHUB_OUTPUT
        echo "web_url=https://$WEB_URL" >> $GITHUB_OUTPUT

    - name: Health check API
      run: |
        sleep 30
        curl -f ${{ steps.app-urls.outputs.api_url }}/health || echo "API health check failed"

    - name: Create deployment summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Application URLs:" >> $GITHUB_STEP_SUMMARY
        echo "- **API**: ${{ steps.app-urls.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **API Docs**: ${{ steps.app-urls.outputs.api_url }}/docs" >> $GITHUB_STEP_SUMMARY
        echo "- **Web App**: ${{ steps.app-urls.outputs.web_url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Docker Images:" >> $GITHUB_STEP_SUMMARY
        echo "- API: \`${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Web: \`${{ steps.acr-creds.outputs.acr_login_server }}/heart-disease-web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  build-only:
    name: Build Docker Images (PR)
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.api
        push: false
        tags: heart-disease-api:pr-${{ github.event.pull_request.number }}

    - name: Build Web Docker image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.web
        push: false
        tags: heart-disease-web:pr-${{ github.event.pull_request.number }}

    - name: PR Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Docker images built successfully!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Images are ready for deployment after merge." >> $GITHUB_STEP_SUMMARY
